name: Build Ephemeris Base Image

# Run manually or on a schedule (quarterly — ephemeris data rarely changes).
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 1 */3 *"  # 03:00 UTC on the 1st of every 3rd month

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ephemeris base image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.ephe-base
          push: true
          tags: |
            ghcr.io/dyai2025/fufire/ephe-base:${{ github.sha }}
